- name : ServiceNow Automation
  hosts: localhost
  connection : local
  gather_facts: no

  vars_files:
    - vars.yaml
  # fetch incidents
  tasks:
      #stage 1 fetch all open incidents

      #task 1 
    - name : get open incidents of last 20 mins
      uri:
        url : "https://dev381973.service-now.com/api/now/table/incident?sysparm_query=active=true^ORDERBYDESCopened_at&sysparm_fields=sys_id,number,short_description,state,active,opened_at&sysparm_limit=1"
        method: GET
        user: "{{servicenow_username}}"
        password: "{{servicenow_password}}"
        force_basic_auth: yes
        headers:
          Accept: "application/json"
        return_content: yes
      register: incidents
    # display incidents
    - name : Display incidents
      debug:
        var: incidents.json.result
    # Process each incidents 
    #task 2
    - name : Extract Kubernetes detail
      set_fact:
        pod_name: "{{ item.short_description | regex_search('Pod:\\s*([a-zA-Z0-9-]+)', '\\1') | first }}"
        issue: "{{ item.short_description | regex_search('Issue:\\s*([A-Za-z0-9_]+)', '\\1') | first }}"
        namespace: "{{ item.short_description | regex_search('Namespace:\\s*([a-zA-Z0-9-]+)', '\\1') | first }}"
        container: "{{ item.short_description | regex_search('Container:\\s*([a-zA-Z0-9-]+)', '\\1') | first }}"
        incident_number: "{{ item.number }}"
        incident_sys_id: "{{ item.sys_id }}"
      loop : "{{incidents.json.result}}"
      register: parsed_incidents

    - name : get pod details 
      command : kubectl get pod {{pod_name}} -n {{namespace}}
      register: pod_status
      changed_when: false
    - name : describe pod 
      command : kubectl describe pod {{pod_name}} -n {{namespace}}
      register: describe_pod
      changed_when: false

      # task 3
    - name : update ServiceNow Incident
      uri:
        url: "https://dev381973.service-now.com/api/now/table/incident/{{ incident_sys_id }}"
        method: PATCH 
        user: "{{servicenow_username}}"
        password: "{{servicenow_password}}"
        force_basic_auth: yes
        headers:
          Accept: "application/json"
          Content-type: "application/json"
        body_format: json 
        body:
          work_notes: |
            Kubernetes diagnostics performed by ansible

            Pod : {{pod_name}}
            Namespace : {{namespace}}
            Container: {{container}}
            Issue : {{issue}}

            ======POD STATUS =====
            {{pod_status.stdout}}

            ======POD Description =====
            {{describe_pod.stdout}}

        status_code: 200
      register: update_result


    
    - name: update ServiceNow Incident
      debug:
        msg: "Incident {{incident_number}} updated successfully"
      when: update_result.status == 200
    - name: show updated information in incident
      debug:
        var: update_result.json

    - name : Get pod health status
      command: >
        kubectl get pod {{ pod_name }}
        -n {{ namespace }}
        -o jsonpath='{.status.phase}{" "}{.status.containerStatuses[0].ready}'
      register: pod_health
      changed_when: false
      failed_when: false

      #task 4
    - name: Display pod health status
      debug:
        msg:
          - "Incident: {{incident_number}}"
          - "Pod: {{pod_name}}"
          - "namespace: {{namespace}}"
          - "pod_health: {{pod_health.stdout}}"

    #task 5
    - name : Add recovery proof for servicenow incidents
      uri:
        url: "https://dev381973.service-now.com/api/now/table/incident/{{ incident_sys_id }}"
        method: PATCH 
        user: "{{servicenow_username}}"
        password: "{{servicenow_password}}"
        force_basic_auth: yes
        headers:
          Accept: "application/json"
          Content-type: "application/json"
        body_format: json 
        body:
          work_notes: |
            ======> Health Verification<=======

            Pod : {{pod_name}}

            Namespace : {{namespace}}

            Health check result: 
            {{pod_health.stdout}}

            Verification:

            we could see pod is running successfully
            Kubernetes pod is healthy

            Incident can be resolved

        status_code: 200
      when: pod_health.stdout == "Running True"

      #task 6

    - name: Close incident
      uri:
        url: "https://dev381973.service-now.com/api/now/table/incident/{{ incident_sys_id }}"
        method: PATCH 
        user: "{{servicenow_username}}"
        password: "{{servicenow_password}}"
        force_basic_auth: yes
        headers:
          Accept: "application/json"
          Content-type: "application/json"
        body_format: json 
        body:
          state: "6"
          incident_state: "6"
          close_code: "solution provided"
          close_notes: |
            issue resolved successfully
            Pod: {{pod_name}}
            Namespace: {{namespace}}
            Container: {{container}}

              Health verification:
              {{pod_health.stdout}}

              Pod is Running and Container is Ready.

              Recovery was verified successfully by Ansible AWX.
          status_code: 200
      when: pod_health.stdout == "Running True"



    - name: Automation completion 
      ansible.builtin.debug:
        msg: "Automation completed"
