apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-api
  namespace: aiops-test

spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api 
    spec:
      containers:
        - name: payment-api 
          image: busybox
          command: ["/bin/sh","-c"]
          args:
            - echo :"Application Crashed"; exit 1
